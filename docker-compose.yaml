services:
  social_media_sensor:
    image: social-media-sensor
    runtime: nvidia
    ports:
      - "8001:8000"
    environment:
        - BLUESKY_HANDLE=${BLUESKY_HANDLE}
        - BLUESKY_PASSWORD=${BLUESKY_PASSWORD}
        - MASTODON_ACCESS_TOKEN=${MASTODON_ACCESS_TOKEN}
        - MASTODON_SERVER=${MASTODON_SERVER}
        - OPENAI_API_KEY=${OPENAI_API_KEY}
        - TARGET_SERVER_ACCESS_TOKEN=${TARGET_SERVER_ACCESS_TOKEN}
        - TARGET_SERVER_DATASET=${TARGET_SERVER_DATASET}
        - LLM_ADDRESS=http://vllm:8000/v1
        - MODEL_NAME=Qwen/Qwen2.5-14B-Instruct
        - GEO_LINKER__DEFAULT_CITY=${GEO_LINKER__DEFAULT_CITY}
    depends_on:
      - vllm
    restart: unless-stopped
  vllm:
    image: "vllm/vllm-openai:latest"
    runtime: nvidia
    ipc: host
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: "--model Qwen/Qwen2.5-14B-Instruct --max_model_len 8192 --quantization bitsandbytes --gpu-memory-utilization 0.8"
    environment:
        - HF_TOKEN=${HF_TOKEN}
        - HF_HUB_DISABLE_XET=1
    restart: unless-stopped
